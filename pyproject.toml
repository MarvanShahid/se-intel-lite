[project]
name = "seintel"
version = "0.2.0"
description = "SE-INTEL Lite: graph grounded repository agent for code QA, quality hotspots and calibrated defect risk (Phase 2)"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "rank-bm25>=0.2.2", "scikit-learn>=1.4", "scipy>=1.11", "numpy>=1.26",
                "radon>=6.0", "pyyaml>=6.0", "anthropic>=0.40"]

[project.scripts]
seintel = "seintel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seintel = ["eval/judge_prompt.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
